version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: innovate_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: innovate_enterprise
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - innovate_network
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: innovate_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/innovate_enterprise
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DEBUG: ${DEBUG:-False}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    volumes:
      - ./backend/app:/app/app
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    networks:
      - innovate_network
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # React Frontend (to be built)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: innovate_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - innovate_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: innovate_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./backend/app/uploads:/var/www/uploads:ro
    depends_on:
      - backend
      - frontend
    networks:
      - innovate_network
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:

networks:
  innovate_network:
    driver: bridge
